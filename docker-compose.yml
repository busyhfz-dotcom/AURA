services:
  backend-engine:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      VERTEX_BRAND_NAME: ${VERTEX_BRAND_NAME:-VERTEX}
      VERTEX_CORS_ORIGINS: ${VERTEX_CORS_ORIGINS:-http://localhost:3000}
      VERTEX_DATABASE_PATH: ${VERTEX_DATABASE_PATH:-/data/vertex.db}
      VERTEX_CRYPTO_WATCHLIST: ${VERTEX_CRYPTO_WATCHLIST:-BTCUSDT,ETHUSDT,SOLUSDT,BNBUSDT,XRPUSDT,DOGEUSDT}
      VERTEX_FOREX_WATCHLIST: ${VERTEX_FOREX_WATCHLIST:-EURUSD,GBPUSD,USDJPY,USDCHF,AUDUSD,USDCAD,XAUUSD}
      VERTEX_FOREX_PROVIDER: ${VERTEX_FOREX_PROVIDER:-}
      VERTEX_FOREX_API_KEY: ${VERTEX_FOREX_API_KEY:-}
      VERTEX_ECONOMIC_CALENDAR_PROVIDER: ${VERTEX_ECONOMIC_CALENDAR_PROVIDER:-}
      VERTEX_ECONOMIC_CALENDAR_API_KEY: ${VERTEX_ECONOMIC_CALENDAR_API_KEY:-}
      VERTEX_NEWS_EMBARGO_BEFORE_MINUTES: ${VERTEX_NEWS_EMBARGO_BEFORE_MINUTES:-30}
      VERTEX_NEWS_EMBARGO_AFTER_MINUTES: ${VERTEX_NEWS_EMBARGO_AFTER_MINUTES:-15}
      VERTEX_TELEGRAM_BOT_TOKEN: ${VERTEX_TELEGRAM_BOT_TOKEN:-}
      VERTEX_TELEGRAM_CHAT_ID: ${VERTEX_TELEGRAM_CHAT_ID:-}
      VERTEX_SCAN_INTERVAL_SECONDS: ${VERTEX_SCAN_INTERVAL_SECONDS:-20}
      VERTEX_ANALYSIS_INTERVAL_SECONDS: ${VERTEX_ANALYSIS_INTERVAL_SECONDS:-120}
      VERTEX_HIGH_VOLATILITY_THRESHOLD_PERCENT: ${VERTEX_HIGH_VOLATILITY_THRESHOLD_PERCENT:-1.5}
      VERTEX_HIGH_RISK_SCORE_THRESHOLD: ${VERTEX_HIGH_RISK_SCORE_THRESHOLD:-70}
    volumes:
      - vertex-data:/data
    restart: unless-stopped

  frontend-dashboard:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_VERTEX_API_URL: ${NEXT_PUBLIC_VERTEX_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend-engine
    restart: unless-stopped

volumes:
  vertex-data:
